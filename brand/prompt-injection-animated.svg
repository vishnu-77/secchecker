<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Prompt injection</title><desc id="desc">Static analysis of source-code trust boundaries. Text alternatives and exact illustrated examples are available in the README.</desc><g opacity="1"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#F4F4EF" stroke="none"/><text xml:space="preserve" x="40" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="15" fill="#62625E" letter-spacing="1">PROMPT INJECTION</text><text xml:space="preserve" x="937" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">SOURCE / REVIEW</text><text xml:space="preserve" x="40" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#111111" letter-spacing="0">01</text><text xml:space="preserve" x="80" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111111" letter-spacing="0">Risky code</text><rect x="40" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="420" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">02</text><text xml:space="preserve" x="460" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Finding</text><rect x="420" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="800" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">03</text><text xml:space="preserve" x="840" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Safer boundary</text><rect x="800" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="40" y="193" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#111111" letter-spacing="0">User content enters privileged instructions.</text><rect x="40" y="236" width="756" height="364" rx="8" fill="#FAFAF7" stroke="#C6C6BF"/><rect x="41" y="237" width="754" height="43" rx="7" fill="#E8E8E2" stroke="none"/><text xml:space="preserve" x="112" y="265" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#62625E" letter-spacing="0">vulnerable.py</text><circle cx="59" cy="259" r="4" fill="#62625E"/><circle cx="75" cy="259" r="4" fill="#62625E"/><circle cx="91" cy="259" r="4" fill="#62625E"/><text xml:space="preserve" x="60" y="315" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">1</text><text xml:space="preserve" x="97" y="315" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#111111" letter-spacing="0">SYSTEM = &quot;You are helpful.&quot;</text><text xml:space="preserve" x="60" y="349" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">2</text><text xml:space="preserve" x="97" y="349" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#111111" letter-spacing="0"></text><text xml:space="preserve" x="60" y="383" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">3</text><text xml:space="preserve" x="97" y="383" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#111111" letter-spacing="0">def build_prompt(user_input):</text><rect x="49" y="392" width="736" height="33" rx="3" fill="#111111" stroke="none"/><text xml:space="preserve" x="60" y="417" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#F4F4EF" letter-spacing="0">4</text><text xml:space="preserve" x="97" y="417" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#F4F4EF" letter-spacing="0">    prompt = f&quot;{SYSTEM} {user_input}&quot;</text><text xml:space="preserve" x="60" y="451" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">5</text><text xml:space="preserve" x="97" y="451" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#111111" letter-spacing="0">    return prompt</text><text xml:space="preserve" x="840" y="255" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">01 / RISKY CODE</text><text xml:space="preserve" x="840" y="297" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111111" letter-spacing="0">A blurred boundary</text><path d="M840 320H1158" stroke="#C6C6BF"/><text xml:space="preserve" x="840" y="360" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">The f-string mixes</text><text xml:space="preserve" x="840" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">user-controlled content</text><text xml:space="preserve" x="840" y="424" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">with system instructions.</text><text xml:space="preserve" x="840" y="456" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0"></text><text xml:space="preserve" x="840" y="488" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">Input can influence</text><text xml:space="preserve" x="840" y="520" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">the model&#x27;s instructions.</text><path d="M40 666H1160" stroke="#C6C6BF"/><text xml:space="preserve" x="40" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="1">STATIC SOURCE ANALYSIS</text><text xml:space="preserve" x="747" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="0">RISKY CODE → FINDING → SAFER BOUNDARY</text><animate 