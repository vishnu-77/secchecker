<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Tool-output execution</title><desc id="desc">Static analysis of source-code trust boundaries. Text alternatives and exact illustrated examples are available in the README.</desc><g opacity="1"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#F4F4EF" stroke="none"/><text xml:space="preserve" x="40" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="15" fill="#62625E" letter-spacing="1">TOOL-OUTPUT EXECUTION</text><text xml:space="preserve" x="937" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">SOURCE / REVIEW</text><text xml:space="preserve" x="40" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#111111" letter-spacing="0">01</text><text xml:space="preserve" x="80" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111111" letter-spacing="0">Risky code</text><rect x="40" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="420" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">02</text><text xml:space="preserve" x="460" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Finding</text><rect x="420" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="800" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">03</text><text xml:space="preserve" x="840" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Safer boundary</text><rect x="800" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="40" y="193" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#111111" letter-spacing="0">A tool result becomes a shell command.</text><rect x="40" y="236" width="756" height="364" rx="8" fill="#FAFAF7" stroke="#C6C6BF"/><rect x="41" y="237" width="754" height="43" rx="7" fill="#E8E8E2" stroke="none"/><text xml:space="preserve" x="112" y="265" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#62625E" letter-spacing="0">vulnerable.py</text><circle cx="59" cy="259" r="4" fill="#62625E"/><circle cx="75" cy="259" r="4" fill="#62625E"/><circle cx="91" cy="259" r="4" fill="#62625E"/><text xml:space="preserve" x="60" y="315" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">1</text><text xml:space="preserve" x="97" y="315" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#111111" letter-spacing="0">import os</text><text xml:space="preserve" x="60" y="349" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">2</text><text xml:space="preserve" x="97" y="349" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#111111" letter-spacing="0"></text><text xml:space="preserve" x="60" y="383" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">3</text><text xml:space="preserve" x="97" y="383" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#111111" letter-spacing="0">def apply_tool_output(mcp_result):</text><rect x="49" y="392" width="736" height="33" rx="3" fill="#111111" stroke="none"/><text xml:space="preserve" x="60" y="417" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#F4F4EF" letter-spacing="0">4</text><text xml:space="preserve" x="97" y="417" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#F4F4EF" letter-spacing="0">    os.system(mcp_result)</text><text xml:space="preserve" x="840" y="255" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">01 / RISKY CODE</text><text xml:space="preserve" x="840" y="297" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111111" letter-spacing="0">Data gains authority</text><path d="M840 320H1158" stroke="#C6C6BF"/><text xml:space="preserve" x="840" y="360" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">The raw tool result</text><text xml:space="preserve" x="840" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">is passed to a shell.</text><text xml:space="preserve" x="840" y="424" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0"></text><text xml:space="preserve" x="840" y="456" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">Returned content can</text><text xml:space="preserve" x="840" y="488" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">determine what runs.</text><path d="M40 666H1160" stroke="#C6C6BF"/><text xml:space="preserve" x="40" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="1">STATIC SOURCE ANALYSIS</text><text xml:space="preserve" x="747" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="0">RISKY CODE → FINDING → SAFER BOUNDARY</text><animate attributeName="opacity" values="1;0;0;1" keyTimes="0.0;0.26666666666666666;0.6;1.0" calcMode="discrete" dur="15s" repeatCount="indefinite"/><rect x="40" y="117" width="0" height="3" fill="#111111"><animate attributeName="width" values="0;360;360" keyTimes="0.0;0.26666666666666666;1.0" dur="15s" repeatCount="indefinite"/></rect></g><g opacity="0"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#F4F4EF" stroke="none"/><text xml:space="preserve" x="40" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="15" fill="#62625E" letter-spacing="1">TOOL-OUTPUT EXECUTION</text><text xml:space="preserve" x="937" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">SOURCE / REVIEW</text><text xml:space="preserve" x="40" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">01</text><text xml:space="preserve" x="80" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Risky code</text><rect x="40" y="117" width="360" height="3" rx="0" fill="#111111" stroke="none"/><text xml:space="preserve" x="420" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#111111" letter-spacing="0">02</text><text xml:space="preserve" x="460" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111111" letter-spacing="0">Finding</text><rect x="420" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="800" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">03</text><text xml:space="preserve" x="840" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Safer boundary</text><rect x="800" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="40" y="193" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#111111" letter-spacing="0">Inspect the transition from data to execution.</text><rect x="40" y="236" width="756" height="364" rx="8" fill="#FAFAF7" stroke="#C6C6BF"/><text xml:space="preserve" x="64" y="271" font-family="Consolas, Liberation Mono, monospace" font-size="15" fill="#62625E" letter-spacing="2">SELECTED FINDING</text><rect x="64" y="297" width="134" height="34" rx="4" fill="#111111" stroke="none"/><text xml:space="preserve" x="82" y="321" font-family="Consolas, Liberation Mono, monospace" font-size="20" fill="#F4F4EF" letter-spacing="0">CRITICAL</text><text xml:space="preserve" x="64" y="371" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#111111" letter-spacing="0">MCP - Tool Call Output Executed Directly</text><text xml:space="preserve" x="64" y="412" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#62625E" letter-spacing="0">Displayed source: vulnerable.py · line 4</text><rect x="64" y="447" width="708" height="56" rx="4" fill="#111111" stroke="none"/><text xml:space="preserve" x="82" y="482" font-family="Consolas, Liberation Mono, monospace" font-size="23" fill="#F4F4EF" letter-spacing="0">os.system(mcp_result)</text><text xml:space="preserve" x="64" y="552" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111" letter-spacing="0">Review this transition before deployment.</text><text xml:space="preserve" x="840" y="255" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">02 / FINDING</text><text xml:space="preserve" x="840" y="297" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111111" letter-spacing="0">Trace the sink</text><path d="M840 320H1158" stroke="#C6C6BF"/><text xml:space="preserve" x="840" y="360" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">os.system receives</text><text xml:space="preserve" x="840" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">the tool result directly.</text><text xml:space="preserve" x="840" y="424" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0"></text><text xml:space="preserve" x="840" y="456" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">The risky transition</text><text xml:space="preserve" x="840" y="488" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">is at the shell call.</text><path d="M40 666H1160" stroke="#C6C6BF"/><text xml:space="preserve" x="40" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="1">STATIC SOURCE ANALYSIS</text><text xml:space="preserve" x="747" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="0">RISKY CODE → FINDING → SAFER BOUNDARY</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0;0.26666666666666666;0.6;1.0" calcMode="discrete" dur="15s" repeatCount="indefinite"/><rect x="420" y="117" width="0" height="3" fill="#111111"><animate attributeName="width" values="0;0;360;360" keyTimes="0.0;0.26666666666666666;0.6;1.0" dur="15s" repeatCount="indefinite"/></rect></g><g opacity="0"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#F4F4EF" stroke="none"/><text xml:space="preserve" x="40" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="15" fill="#62625E" letter-spacing="1">TOOL-OUTPUT EXECUTION</text><text xml:space="preserve" x="937" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">SOURCE / REVIEW</text><text xml:space="preserve" x="40" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">01</text><text xml:space="preserve" x="80" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Risky code</text><rect x="40" y="117" width="360" height="3" rx="0" fill="#111111" stroke="none"/><text xml:space="preserve" x="420" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">02</text><text xml:space="preserve" x="460" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Finding</text><rect x="420" y="117" width="360" height="3" rx="0" fill="#111111" stroke="none"/><text xml:space="preserve" x="800" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#111111" letter-spacing="0">03</text><text xml:space="preserve" x="840" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111111" letter-spacing="0">Safer boundary</text><rect x="800" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="40" y="193" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#111111" letter-spacing="0">Record the result as data; remove shell execution.</text><rect x="40" y="236" width="756" height="364" rx="8" fill="#FAFAF7" stroke="#C6C6BF"/><rect x="41" y="237" width="754" height="43" rx="7" fill="#E8E8E2" stroke="none"/><text xml:space="preserve" x="112" y="265" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#62625E" letter-spacing="0">safe.py</text><circle cx="59" cy="259" r="4" fill="#62625E"/><circle cx="75" cy="259" r="4" fill="#62625E"/><circle cx="91" cy="259" r="4" fill="#62625E"/><text xml:space="preserve" x="60" y="315" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">1</text><text xml:space="preserve" x="97" y="315" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#111111" letter-spacing="0">def apply_tool_output(mcp_result, audit_log):</text><text xml:space="preserve" x="60" y="349" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">2</text><text xml:space="preserve" x="97" y="349" font-family="Consolas, Liberation Mono, monospace" font-size="21" fill="#111111" letter-spacing="0">    audit_log.write(mcp_result)</text><text xml:space="preserve" x="840" y="255" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">03 / SAFER BOUNDARY</text><text xml:space="preserve" x="840" y="297" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111111" letter-spacing="0">Remove execution</text><path d="M840 320H1158" stroke="#C6C6BF"/><text xml:space="preserve" x="840" y="360" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">Write the result to</text><text xml:space="preserve" x="840" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">an audit log as data.</text><text xml:space="preserve" x="840" y="424" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0"></text><text xml:space="preserve" x="840" y="456" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">This change removes</text><text xml:space="preserve" x="840" y="488" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">shell execution; it is</text><text xml:space="preserve" x="840" y="520" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">a different behavior.</text><rect x="40" y="613" width="756" height="34" rx="4" fill="#E5E5DF" stroke="none"/><text xml:space="preserve" x="57" y="637" font-family="Consolas, Liberation Mono, monospace" font-size="19" fill="#111111" letter-spacing="0">This example: [+] No findings detected.</text><path d="M40 666H1160" stroke="#C6C6BF"/><text xml:space="preserve" x="40" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="1">STATIC SOURCE ANALYSIS</text><text xml:space="preserve" x="747" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="0">RISKY CODE → FINDING → SAFER BOUNDARY</text><animate attributeName="opacity" values="0;0;1;0" keyTimes="0.0;0.26666666666666666;0.6;1.0" calcMode="discrete" dur="15s" repeatCount="indefinite"/><rect x="800" y="117" width="0" height="3" fill="#111111"><animate attributeName="width" values="0;0;360" keyTimes="0.0;0.6;1.0" dur="15s" repeatCount="indefinite"/></rect></g></svg>