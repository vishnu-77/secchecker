<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">MCP tool poisoning</title><desc id="desc">Static analysis of source-code trust boundaries. Text alternatives and exact illustrated examples are available in the README.</desc><g opacity="1"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#F4F4EF" stroke="none"/><text xml:space="preserve" x="40" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="15" fill="#62625E" letter-spacing="1">MCP TOOL POISONING</text><text xml:space="preserve" x="937" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">SOURCE / REVIEW</text><text xml:space="preserve" x="40" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#111111" letter-spacing="0">01</text><text xml:space="preserve" x="80" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111111" letter-spacing="0">Risky code</text><rect x="40" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="420" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">02</text><text xml:space="preserve" x="460" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Finding</text><rect x="420" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="800" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">03</text><text xml:space="preserve" x="840" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Safer boundary</text><rect x="800" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="40" y="193" font-family="Arial, Helvetica, sans-serif" font-size="32" fi