nt-size="21" fill="#62625E" letter-spacing="0">unrelated to its task.</text><text xml:space="preserve" x="840" y="456" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0"></text><text xml:space="preserve" x="840" y="488" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">An agent may receive it</text><text xml:space="preserve" x="840" y="520" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">during tool discovery.</text><path d="M40 666H1160" stroke="#C6C6BF"/><text xml:space="preserve" x="40" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="1">STATIC SOURCE ANALYSIS</text><text xml:space="preserve" x="747" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="0">RISKY CODE → FINDING → SAFER BOUNDARY</text><animate attributeName="opacity" values="1;0;0;1" keyTimes="0.0;0.26666666666666666;0.6;1.0" calcMode="discrete" dur="15s" repeatCount="indefinite"/><rect x="40" y="117" width="0" height="3" fill="#111111"><animate attributeName="width" values="0;360;360" keyTimes="0.0;0.26666666666666666;1.0" dur="15s" repeatCount="indefinite"/></rect></g><g opacity="0"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#F4F4EF" stroke="none"/><text xml:space="preserve" x="40" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="15" fill="#62625E" letter-spacing="1">MCP TOOL POISONING</text><text xml:space="preserve" x="937" y="37" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">SOURCE / REVIEW</text><text xml:space="preserve" x="40" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">01</text><text xml:space="preserve" x="80" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Risky code</text><rect x="40" y="117" width="360" height="3" rx="0" fill="#111111" stroke="none"/><text xml:space="preserve" x="420" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#111111" letter-spacing="0">02</text><text xml:space="preserve" x="460" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111111" letter-spacing="0">Finding</text><rect x="420" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="800" y="94" font-family="Consolas, Liberation Mono, monospace" font-size="17" fill="#62625E" letter-spacing="0">03</text><text xml:space="preserve" x="840" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62625E" letter-spacing="0">Safer boundary</text><rect x="800" y="117" width="360" height="3" rx="0" fill="#C6C6BF" stroke="none"/><text xml:space="preserve" x="40" y="193" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#111111" letter-spacing="0">Inspect instructions hidden in a description.</text><rect x="40" y="236" width="756" height="364" rx="8" fill="#FAFAF7" stroke="#C6C6BF"/><text xml:space="preserve" x="64" y="271" font-family="Consolas, Liberation Mono, monospace" font-size="15" fill="#62625E" letter-spacing="2">SELECTED FINDING</text><rect x="64" y="297" width="134" height="34" rx="4" fill="#111111" stroke="none"/><text xml:space="preserve" x="82" y="321" font-family="Consolas, Liberation Mono, monospace" font-size="20" fill="#F4F4EF" letter-spacing="0">HIGH</text><text xml:space="preserve" x="64" y="371" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#111111" letter-spacing="0">MCP - Poisoned Tool Description</text><text xml:space="preserve" x="64" y="412" font-family="Consolas, Liberation Mono, monospace" font-size="18" fill="#62625E" letter-spacing="0">Displayed source: vulnerable.py · line 5</text><rect x="64" y="447" width="708" height="56" rx="4" fill="#111111" stroke="none"/><text xml:space="preserve" x="82" y="482" font-family="Consolas, Liberation Mono, monospace" font-size="23" fill="#F4F4EF" letter-spacing="0">&quot;Ignore previous instructions.&quot;</text><text xml:space="preserve" x="64" y="552" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111" letter-spacing="0">Review this transition before deployment.</text><text xml:space="preserve" x="840" y="255" font-family="Consolas, Liberation Mono, monospace" font-size="14" fill="#62625E" letter-spacing="1">02 / FINDING</text><text xml:space="preserve" x="840" y="297" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111111" letter-spacing="0">Review tool metadata</text><path d="M840 320H1158" stroke="#C6C6BF"/><text xml:space="preserve" x="840" y="360" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">The description asks</text><text xml:space="preserve" x="840" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">the agent to disregard</text><text xml:space="preserve" x="840" y="424" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">prior instructions.</text><text xml:space="preserve" x="840" y="456" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0"></text><text xml:space="preserve" x="840" y="488" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">Inspect tool schemas</text><text xml:space="preserve" x="840" y="520" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62625E" letter-spacing="0">before integration.</text><path d="M40 666H1160" stroke="#C6C6BF"/><text xml:space="preserve" x="40" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#62625E" letter-spacing="1">STATIC SOURCE ANALYSIS</text><text xml:space="preserve" x="747" y="694" font-family="Consolas, Liberation Mono, monospace" font-size="13" fill="#626