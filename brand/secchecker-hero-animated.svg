<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SecChecker trust-boundary scan</title>
  <desc id="desc">A restrained monochrome animation showing AI context converging on a scan boundary before consequential action.</desc>
  <rect width="1200" height="420" rx="18" fill="#F4F4EF"/>
  <style>
    .label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#62625E;font-size:13px;letter-spacing:3px}
    .main{font-family:Inter,Helvetica Neue,Arial,sans-serif;fill:#111;font-weight:400}
    .hair{stroke:#A7A7A0;stroke-width:1.5;fill:none}
    .ink{fill:#111}
    .muted{fill:#777772}
  </style>

  <text x="42" y="42" class="label">SC / 01</text>
  <text x="1042" y="42" class="label">STATIC</text>
  <line x1="42" y1="62" x2="1158" y2="62" class="hair"/>

  <text x="42" y="112" class="label">UNTRUSTED CONTEXT</text>
  <text x="912" y="112" class="label">CONSEQUENTIAL ACTION</text>

  <g class="label" font-size="12">
    <text x="42" y="158">PROMPT</text><text x="42" y="198">RAG</text><text x="42" y="238">MCP</text><text x="42" y="278">MODEL</text><text x="42" y="318">MEMORY</text>
    <text x="1035" y="178">TOOL</text><text x="1035" y="218">API</text><text x="1035" y="258">SHELL</text><text x="1035" y="298">MEMORY</text>
  </g>

  <g stroke="#A7A7A0" stroke-width="1.5" fill="none">
    <path d="M145 153H465"/><path d="M145 193H465"/><path d="M145 233H465"/><path d="M145 273H465"/><path d="M145 313H465"/>
    <path d="M735 173H1010"/><path d="M735 213H1010"/><path d="M735 253H1010"/><path d="M735 293H1010"/>
  </g>

  <g fill="#111">
    <circle cy="153" r="4"><animate attributeName="cx" values="165;445;165" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cy="193" r="4"><animate attributeName="cx" values="190;445;190" dur="5.4s" begin=".35s" repeatCount="indefinite"/></circle>
    <circle cy="233" r="4"><animate attributeName="cx" values="150;445;150" dur="5.4s" begin=".7s" repeatCount="indefinite"/></circle>
    <circle cy="273" r="4"><animate attributeName="cx" values="210;445;210" dur="5.4s" begin="1.05s" repeatCount="indefinite"/></circle>
    <circle cy="313" r="4"><animate attributeName="cx" values="175;445;175" dur="5.4s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(492 105)">
    <rect x="0" y="0" width="216" height="216" rx="12" fill="#EEEEEA" stroke="#C5C5BF"/>
    <g fill="none" stroke="#111" stroke-width="6" stroke-linecap="round">
      <path d="M34 80V46c0-7 5-12 12-12h34"/><path d="M136 34h34c7 0 12 5 12 12v34"/>
      <path d="M182 136v34c0 7-5 12-12 12h-34"/><path d="M80 182H46c-7 0-12-5-12-12v-34"/>
    </g>
    <g fill="#111">
      <circle cx="108" cy="66" r="2.5" opacity=".3"/><circle cx="90" cy="74" r="2.5" opacity=".3"/><circle cx="126" cy="74" r="2.5" opacity=".3"/>
      <circle cx="74" cy="90" r="2.5" opacity=".3"/><circle cx="90" cy="90" r="3.6" opacity=".5"/><circle cx="108" cy="90" r="5" opacity=".75"/><circle cx="126" cy="90" r="3.6" opacity=".5"/><circle cx="142" cy="90" r="2.5" opacity=".3"/>
      <circle cx="68" cy="108" r="2.5" opacity=".3"/><circle cx="86" cy="108" r="3.6" opacity=".5"/><circle cx="102" cy="108" r="5.5" opacity=".8"/><circle cx="114" cy="108" r="5.5" opacity=".8"/><circle cx="130" cy="108" r="3.6" opacity=".5"/><circle cx="148" cy="108" r="2.5" opacity=".3"/>
      <circle cx="74" cy="126" r="2.5" opacity=".3"/><circle cx="90" cy="126" r="3.6" opacity=".5"/><rect x="103" y="121" width="10" height="10" rx="1"><animate attributeName="opacity" values=".55;1;.55" dur="2.2s" repeatCount="indefinite"/></rect><circle cx="126" cy="126" r="3.6" opacity=".5"/><circle cx="142" cy="126" r="2.5" opacity=".3"/>
      <circle cx="90" cy="144" r="2.5" opacity=".3"/><circle cx="108" cy="150" r="2.5" opacity=".3"/><circle cx="126" cy="144" r="2.5" opacity=".3"/>
    </g>
    <line x1="18" x2="198" y1="108" y2="108" stroke="#111" stroke-width="1.5" opacity=".18">
      <animate attributeName="y1" values="58;158;58" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="58;158;58" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".08;.55;.08" dur="3.8s" repeatCount="indefinite"/>
    </line>
    <text x="108" y="202" text-anchor="middle" class="label" font-size="10">CHECK</text>
  </g>

  <g fill="#111">
    <circle cy="173" r="4"><animate attributeName="cx" values="755;990;755" dur="5.4s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cy="213" r="4"><animate attributeName="cx" values="755;990;755" dur="5.4s" begin="2.15s" repeatCount="indefinite"/></circle>
    <circle cy="253" r="4"><animate attributeName="cx" values="755;990;755" dur="5.4s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cy="293" r="4"><animate attributeName="cx" values="755;990;755" dur="5.4s" begin="2.85s" repeatCount="indefinite"/></circle>
  </g>

  <line x1="42" y1="348" x2="1158" y2="348" class="hair"/>
  <text x="42" y="390" class="main" font-size="34" letter-spacing="-1">secchecker</text>
  <text x="240" y="389" class="label">TRUST BOUNDARIES FOR AI</text>
  <text x="948" y="389" class="label">LOCAL / DETERMINISTIC</text>
</svg>