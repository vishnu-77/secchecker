<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">SecChecker mark</title>
  <desc id="desc">A geometrically symmetric monochrome scan window surrounding a focused dot-matrix trust boundary.</desc>
  <rect width="256" height="256" rx="32" fill="#F4F4EF"/>

  <!-- Scan window: mirrored around the exact centre (128,128). -->
  <g fill="none" stroke="#111111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 92V62Q48 48 62 48H92"/>
    <path d="M164 48H194Q208 48 208 62V92"/>
    <path d="M208 164V194Q208 208 194 208H164"/>
    <path d="M92 208H62Q48 208 48 194V164"/>
  </g>

  <!-- Dot field: every point is mirrored across both axes. -->
  <g fill="#111111">
    <!-- outer ring -->
    <circle cx="128" cy="64" r="2.5" opacity=".30"/><circle cx="128" cy="192" r="2.5" opacity=".30"/>
    <circle cx="64" cy="128" r="2.5" opacity=".30"/><circle cx="192" cy="128" r="2.5" opacity=".30"/>
    <circle cx="80" cy="80" r="2.5" opacity=".30"/><circle cx="176" cy="80" r="2.5" opacity=".30"/>
    <circle cx="80" cy="176" r="2.5" opacity=".30"/><circle cx="176" cy="176" r="2.5" opacity=".30"/>

    <!-- ring 3 -->
    <circle cx="112" cy="80" r="3" opacity=".38"/><circle cx="144" cy="80" r="3" opacity=".38"/>
    <circle cx="112" cy="176" r="3" opacity=".38"/><circle cx="144" cy="176" r="3" opacity=".38"/>
    <circle cx="80" cy="112" r="3" opacity=".38"/><circle cx="80" cy="144" r="3" opacity=".38"/>
    <circle cx="176" cy="112" r="3" opacity=".38"/><circle cx="176" cy="144" r="3" opacity=".38"/>

    <!-- ring 2 -->
    <circle cx="96" cy="96" r="4" opacity=".55"/><circle cx="128" cy="96" r="4.5" opacity=".62"/><circle cx="160" cy="96" r="4" opacity=".55"/>
    <circle cx="96" cy="160" r="4" opacity=".55"/><circle cx="128" cy="160" r="4.5" opacity=".62"/><circle cx="160" cy="160" r="4" opacity=".55"/>
    <circle cx="96" cy="128" r="4.5" opacity=".62"/><circle cx="160" cy="128" r="4.5" opacity=".62"/>

    <!-- ring 1 -->
    <circle cx="112" cy="112" r="5" opacity=".78"/><circle cx="128" cy="112" r="5" opacity=".78"/><circle cx="144" cy="112" r="5" opacity=".78"/>
    <circle cx="112" cy="128" r="5" opacity=".78"/><circle cx="144" cy="128" r="5" opacity=".78"/>
    <circle cx="112" cy="144" r="5" opacity=".78"/><circle cx="128" cy="144" r="5" opacity=".78"/><circle cx="144" cy="144" r="5" opacity=".78"/>

    <!-- inspected boundary -->
    <rect x="122" y="122" width="12" height="12" rx="1"/>
  </g>
</svg>
