name: 'secchecker'
description: 'Static security scanner for AI agents, MCP tools, and LLM applications — plus secrets and infrastructure misconfigurations'
author: 'Vishnu Prashanth'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  path:
    description: 'Path to scan (directory or file)'
    required: false
    default: '.'
  type:
    description: 'Scan type: secrets, llm, devsecops, all'
    required: false
    default: 'llm'
  format:
    description: 'Output format: json, md, xml, sarif, html'
    required: false
    default: 'sarif'
  severity-threshold:
    description: 'Minimum severity level: LOW, MEDIUM, HIGH, CRITICAL'
    required: false
    default: 'LOW'
  output:
    description: 'Output file path'
    required: false
    default: 'secchecker_report.sarif'
  fail-on-findings:
    description: 'Fail the action if findings are detected'
    required: false
    default: 'true'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  version:
    description: 'secchecker version to install ("latest" or e.g. "0.3.0")'
    required: false
    default: 'latest'

outputs:
  report-path:
    description: 'Path to the generated report file'
    value: ${{ steps.run-scan.outputs.report_path }}
  findings-detected:
    description: 'Whether any findings were detected (true/false)'
    value: ${{ steps.run-scan.outputs.findings_detected }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install secchecker
      shell: bash
      env:
        SECCHECKER_VERSION: ${{ inputs.version }}
      run: |
        if [ "$SECCHECKER_VERSION" = "latest" ]; then
          pip install secchecker
        else
          pip install "secchecker==$SECCHECKER_VERSION"
        fi

    - name: Run secchecker scan
      id: run-scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_TYPE: ${{ inputs.type }}
        SCAN_FORMAT: ${{ inputs.format }}
        SCAN_OUTPUT: ${{ inputs.output }}
        SCAN_SEVERITY: ${{ inputs.severity-threshold }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: |
        set +e
        secchecker "$SCAN_PATH" \
          --type "$SCAN_TYPE" \
          --format "$SCAN_FORMAT" \
          --output "$SCAN_OUTPUT" \
          --severity-threshold "$SCAN_SEVERITY"
        SCAN_EXIT=$?
        printf "report_path=%s\n" "$SCAN_OUTPUT" >> "$GITHUB_OUTPUT"
        if [ $SCAN_EXIT -eq 1 ]; then
          echo "findings_detected=true" >> "$GITHUB_OUTPUT"
        else
          echo "findings_detected=false" >> "$GITHUB_OUTPUT"
        fi
        # Exit code 2 = runtime/config/reporting error. Never let it pass as success.
        if [ $SCAN_EXIT -ge 2 ]; then
          echo "::error::secchecker exited with a runtime error (exit $SCAN_EXIT)."
          exit $SCAN_EXIT
        fi
        if [ "$FAIL_ON_FINDINGS" = "true" ] && [ $SCAN_EXIT -eq 1 ]; then
          echo "::error::secchecker found security issues. See $SCAN_OUTPUT"
          exit 1
        fi

    - name: Upload SARIF to GitHub Security tab
      if: inputs.format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
      with:
        sarif_file: ${{ inputs.output }}
      continue-on-error: true
