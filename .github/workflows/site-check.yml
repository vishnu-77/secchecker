name: Site Check

on:
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/verify_website_demo.py'
      - 'brand/**'
      - 'README.md'
      - '.github/workflows/site-check.yml'
  push:
    branches: [main, web-develop, main-website]
    paths:
      - 'website/**'
      - 'scripts/verify_website_demo.py'
      - 'brand/**'
      - 'README.md'
      - '.github/workflows/site-check.yml'

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify recorded scan illustration
        run: python scripts/verify_website_demo.py
      - name: Validate HTML, assets and public-surface constraints
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          root = Path('website')
          html_path = root / 'index.html'
          css_path = root / 'styles.css'

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag in {'img', 'script'} and attrs.get('src'):
                      self.refs.append(attrs['src'])
                  if tag == 'link' and attrs.get('href') and attrs.get('rel') in {'stylesheet', 'icon'}:
                      self.refs.append(attrs['href'])

          html = html_path.read_text(encoding='utf-8')
          parser = Parser()
          parser.feed(html)

          missing = []
          for ref in parser.refs:
              if re.match(r'^(https?:|#|data:)', ref):
                  continue
              path = root / ref.split('?', 1)[0]
              if not path.exists():
                  missing.append(ref)
          if missing:
              raise SystemExit(f'missing website assets: {missing}')

          css = css_path.read_text(encoding='utf-8').lower()
          forbidden_design = {
              'linear-gradient': 'gradients',
              'radial-gradient': 'gradients',
              'box-shadow': 'gloss/shadows',
              'text-shadow': 'glow/shadows',
              'backdrop-filter': 'glass effects',
              'filter: blur': 'decorative blur',
          }
          violations = [label for token, label in forbidden_design.items() if token in css]
          if violations:
              raise SystemExit('forbidden design effects present: ' + ', '.join(sorted(set(violations))))

          public_surface = html.lower()
          forbidden_public_detail = {
              'bench/': 'internal benchmark path',
              'agentsecbench': 'internal corpus name',
              'methodology.md': 'internal methodology path',
              'scan_file_llm': 'scanner implementation symbol',
              'python ast': 'implementation detail',
              'root-cause': 'internal analysis detail',
              'root cause': 'internal analysis detail',
              'hand-triaged': 'internal triage detail',
              'fixture': 'internal test construction detail',
              'roadmap.md': 'internal roadmap path',
          }
          exposed = [label for token, label in forbidden_public_detail.items() if token in public_surface]
          if exposed:
              raise SystemExit('internal detail exposed on public website: ' + ', '.join(sorted(set(exposed))))

          mark = (root / 'assets/secchecker-mark.svg').read_text(encoding='utf-8')
          required_mark_tokens = {
              'SecChecker origami lock': 'approved mark identity',
              'folded-paper padlock': 'approved mark description',
          }
          missing_mark = [label for token, label in required_mark_tokens.items() if token not in mark]
          if missing_mark:
              raise SystemExit('website mark is missing: ' + ', '.join(missing_mark))

          js = (root / 'script.js').read_text(encoding='utf-8')
          interaction_contract = {
              'hero-lock-state-dot': ('html', html, 'single semantic hero status light'),
              'data-workflow-trigger="0"': ('html', html, 'workflow scroll checkpoints'),
              '.workflow-sticky{position:sticky': ('css', css, 'sticky workflow rail'),
              '.workflow-scroll-trigger{height:56vh': ('css', css, 'scroll trigger height'),
              "querySelectorAll('[data-workflow-trigger]')": ('js', js, 'scroll checkpoint controller'),
          }
          missing_interactions = [label for _, source, label in interaction_contract.values() if _ not in source]
          if missing_interactions:
              raise SystemExit('website interaction contract missing: ' + ', '.join(missing_interactions))

          print('site check: OK')
          print('relative assets:', len(parser.refs))
          print('public-surface policy: OK')
          print('logo identity: OK')
          print('interaction contract: OK')
          PY
