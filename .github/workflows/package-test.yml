name: Package Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  package-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Test package installation
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
          python -m build
          pip install dist/*.whl
      
      - name: Test installed package
        run: |
          # Treat exit 0 (clean) and 1 (findings) as success; fail on 2+ (runtime error).
          run_scan() { local rc=0; "$@" || rc=$?; if [ $rc -ge 2 ]; then echo "::error::secchecker exited $rc"; exit $rc; fi; }
          # Test CLI from installed wheel
          secchecker --help
          # Test basic functionality + every advertised output format from the wheel
          mkdir test_scan
          echo 'password="test123"' > test_scan/config.py
          echo 'prompt += tool_result' > test_scan/agent.py
          run_scan secchecker test_scan --type all --format json --output report.json
          run_scan secchecker test_scan --type all --format sarif --output report.sarif
          run_scan secchecker test_scan --type all --format html --output report.html
          test -f report.json && echo "JSON report OK"
          test -f report.sarif && echo "SARIF report OK"
          test -f report.html && echo "HTML report OK"
          # Confirm the HTML reporter is actually importable from the installed wheel
          python -c "from secchecker.html_reporter import to_html, generate_html_report; print('html_reporter import OK')"
          # Clean up
          rm -rf test_scan report.json report.sarif report.html