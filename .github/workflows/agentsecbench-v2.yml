name: AgentSecBench v2

on:
  push:
    branches:
      - bench/agentsecbench-v2
    paths:
      - .github/workflows/agentsecbench-v2.yml
      - bench/agentsecbench-v2/manifest.json
      - bench/agentsecbench-v2/run.py
      - bench/agentsecbench-v2/summarize.py

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SecChecker from this checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify scanner source is unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 17f6b8ffb3a7e8c03fb3cb0cd104b23870201bc3...HEAD -- secchecker pyproject.toml | wc -l)" -eq 0
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          print("scanner package version:", data["project"]["version"])
          PY

      - name: Run frozen external corpus
        run: python bench/agentsecbench-v2/run.py

      - name: Summarize raw benchmark output
        run: python bench/agentsecbench-v2/summarize.py

      - name: Commit benchmark results only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/agentsecbench-v2/results
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "bench: record AgentSecBench v2 first-pass results"
          git push origin HEAD:bench/agentsecbench-v2
